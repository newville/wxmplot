[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm>=6.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
write_to = "wxmplot/version.py"
version_scheme = "post-release"

[tool.setuptools.packages.find]
include = ["wxmplot"]

[tool.coverage.run]
omit = ["tests/*"]

[project]
name = "wxmplot"
dynamic = ["version"]
requires-python = ">= 3.11"
description = "wxPython plotting widgets using matplotlib"
readme = "README.md"
authors = [
  {name = "Matthew Newville", email = "matt.newville@gmail.com"}
  ]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["wxPython", "matplotlib"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Visualization",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14"
    ]

dependencies = [
   "wxPython>=4.2.3",
   "wxutils>=2026.3.0",
   "darkdetect",
   "pyobjc-framework-Cocoa; platform_system == 'Darwin'",
   "matplotlib>=3.9.0",
   "pytz",
   "numpy>=2.0",
   "Pillow>=7.0",
   "pyyaml>=5.0",
   "pyshortcuts>=1.9.8",
   "vispy>=0.16.2",
   "pyopengl>=3.1.10",
   "pyopengl-accelerate>=3.1.10",
]

[project.urls]
Homepage = "https://github.com/newville/wxmplot"
Documentation = "https://newville.github.io/wxmplot"
Tracker = "https://github.com/newville/wxmplot/issues"

[project.optional-dependencies]
dev = ["build", "twine"]
doc = ["Sphinx", "jupyter_sphinx", "sphinx-copybutton", "sphinxcontrib-video",
       "nbsphinx", "sphinx-design", "sphinx-breeze-theme"]

test = ["pytest", "pytest-cov", "coverage"]
all = ["wxmplot[dev, doc, test]"]
